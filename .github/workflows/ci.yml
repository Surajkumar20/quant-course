name: ci

# Tests only the projects listed in tools/enabled_projects.txt, so an
# unfinished project doesn't turn your fork red.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/run_tests.py --enabled
